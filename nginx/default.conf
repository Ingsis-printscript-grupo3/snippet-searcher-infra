# El reverse proxy del sistema (nginx): la unica puerta de entrada
# Reparte por ruta a los servicios de la red interna
# Se monta en el contenedor nginx del docker-stack.yml.

# El 80 solo deja pasar la validacion de let's encrypt y manda todo lo demas a https
server {
    listen 80;
    server_name grupo3-snippet-dev.duckdns.org;

    # el archivo que Let's Encrypt viene a leer. Siempre por el 80, tambien al renovar
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 301 y no 302: el navegador se lo acuerda y la prox vez va directo a https
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name grupo3-snippet-dev.duckdns.org;

    # fullchain y no cert: incluye el intermedio de Let's Encrypt, que el navegador necesita
    ssl_certificate     /etc/letsencrypt/live/grupo3-snippet-dev.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grupo3-snippet-dev.duckdns.org/privkey.pem;
    # las versiones viejas tienen agujeros conocidos
    ssl_protocols TLSv1.2 TLSv1.3;

    # El DNS interno de Docker para traducir nombres de servicio a IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Valen para todos los location de abajo. El servicio de atras necesita saber con que nombre
    # y con que esquema entro el pedido de verdad; sin esto ve siempre http y el nombre interno,
    # y los redirects de Auth0 salen mal.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # un snippet se puede subir como archivo y el default de nginx es 1m
    client_max_body_size 10m;

    # para probar que el proxy esta vivo
    location = /health {
        access_log off;
        return 200 "proxy ok\n";
    }

    # reenvia a snippet-service:8080
    location /snippets {
        set $snippet_service http://snippet-service:8080; # en variable, si no nginx no actualiza la ip
        proxy_pass $snippet_service$request_uri;    # para reponer la ruta que la variable hace perder
    }
    # reenvia a permission-service:8081
    location /users {
        set $permission_service http://permission-service:8081;
        proxy_pass $permission_service$request_uri;
    }

    # La UI (location /) se agrega cuando este la imagen del fork.
}
