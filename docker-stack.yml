# el sistema entero de Snippet Searcher en Docker Swarm. Idem docker-compose.yml de
# snippet-service, pero con las imagenes publicadas en ghcr

# Se despliega con docker stack deploy -c docker-stack.yml snippet-searcher

# Swarm ignora depends_on: cada servicio arranca cuando puede y, si su base todavia no esta, se cae y
# Swarm lo vuelve a levantar (restart_policy) hasta que conecta.

# lo que comparten los tres servicios propios
x-app-deploy: &app-deploy
  replicas: 1
  resources:
    limits:
      memory: 512M
  restart_policy:
    condition: on-failure
    delay: 5s
  # rolling update: levanta el contenedor nuevo, espera a que el HEALTHCHECK de la imagen de healthy y
  # recien ahi baja el viejo. Si el nuevo no levanta, vuelve a la version anterior
  update_config:
    parallelism: 1
    order: start-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    order: start-first

# las bases: un solo contenedor por volumen, nunca dos escribiendo los mismos datos
x-db-deploy: &db-deploy
  replicas: 1
  resources:
    limits:
      memory: 256M
  restart_policy:
    condition: on-failure
    delay: 5s
  update_config:
    order: stop-first

services:
  # la unica puerta de entrada al sistema
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # el dominio del ambiente. La imagen lo reemplaza en el template al arrancar
      DOMAIN: ${DOMAIN:?falta DOMAIN}
    volumes:
      # la config sale del repo clonado en la VM; INFRA_DIR es su ruta absoluta
      - ${INFRA_DIR:?falta INFRA_DIR}/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # el archivo de validacion que deja certbot, para que nginx lo sirva
      - ${INFRA_DIR}/certbot/www:/var/www/certbot:ro
      # los certificados. ro: nginx los lee, no los toca
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s

  # se llega por el proxy, en /snippets
  snippet-service:
    image: ghcr.io/ingsis-printscript-grupo3/snippet-service:${TAG:?falta TAG}
    environment:
      DB_URL: jdbc:postgresql://snippet-db:5432/snippets
      DB_USER: ${SNIPPET_DB_USER:?falta SNIPPET_DB_USER}
      DB_PASSWORD: ${SNIPPET_DB_PASSWORD:?falta SNIPPET_DB_PASSWORD}
      PRINTSCRIPT_SERVICE_URL: http://printscript-service:8080
      PERMISSION_SERVICE_URL: http://permission-service:8081
      ASSET_SERVICE_URL: http://asset-service:8080
      # hacen falta los tres: snippet-service no tiene forward-headers-strategy, asi que Spring ve
      # el pedido como http y un Origin https le parece cruzado aunque venga del mismo dominio
      CORS_ALLOWED_ORIGINS: https://grupo3-snippet-dev.duckdns.org,https://grupo3-snippet-prod.duckdns.org,http://localhost:5173
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - backend
    deploy: *app-deploy

  snippet-db:
    image: postgres:17
    environment:
      POSTGRES_DB: snippets
      POSTGRES_USER: ${SNIPPET_DB_USER}
      POSTGRES_PASSWORD: ${SNIPPET_DB_PASSWORD}
    volumes:
      - snippet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    deploy: *db-deploy

  # stateless: no tiene base. Redis es la cola de trabajos, no su base
  printscript-service:
    image: ghcr.io/ingsis-printscript-grupo3/printscript-service:${TAG}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - backend
    deploy: *app-deploy

  # la cola de trabajos (Redis Streams) entre snippet-service y printscript-service. appendonly + volumen:
  # los pedidos pendientes sobreviven a un reinicio de Redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    deploy: *db-deploy

  permission-service:
    image: ghcr.io/ingsis-printscript-grupo3/permission-service:${TAG}
    environment:
      DB_URL: jdbc:postgresql://permission-db:5432/permissions
      DB_USER: ${PERMISSION_DB_USER:?falta PERMISSION_DB_USER}
      DB_PASSWORD: ${PERMISSION_DB_PASSWORD:?falta PERMISSION_DB_PASSWORD}
    networks:
      - backend
    deploy: *app-deploy

  permission-db:
    image: postgres:17
    environment:
      POSTGRES_DB: permissions
      POSTGRES_USER: ${PERMISSION_DB_USER}
      POSTGRES_PASSWORD: ${PERMISSION_DB_PASSWORD}
    volumes:
      - permission-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    deploy: *db-deploy

  # el bucket: el asset service de la catedra guardando en Azurite
  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:latest
    environment:
      AZURE_HOST: http://azurite
      NEW_RELIC_AGENT_ENABLED: "false"
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    hostname: azurite
    volumes:
      - blob-data:/data
    networks:
      - backend
    deploy: *db-deploy

# overlay: la red de Swarm. Los servicios se encuentran por nombre, igual que en el compose
networks:
  backend:
    driver: overlay

volumes:
  snippet-data:
  permission-data:
  blob-data:
  redis-data:
